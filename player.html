<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="referrer" content="strict-origin-when-cross-origin">
<style>html,body,#p{margin:0;width:100%;height:100%;background:#000}</style></head><body><div id="p"></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
var id=new URLSearchParams(location.search).get('v');
function send(t,d){parent.postMessage({imt:t,data:d},'*')}
function onYouTubeIframeAPIReady(){if(!/^[\w-]{11}$/.test(id||''))return send('error','bad-id');
new YT.Player('p',{videoId:id,width:'100%',height:'100%',playerVars:{playsinline:1,rel:0,origin:location.origin},
events:{onReady:function(){send('ready')},onStateChange:function(e){send('state',e.data)},onError:function(e){send('error',e.data)}}})}
</script></body></html>
